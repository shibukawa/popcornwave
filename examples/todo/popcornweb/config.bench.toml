# The configuration the load test runs under. A direct run selects it with
# APP_ENV=bench; load.sh copies it as config.dev.toml for its loopback-only
# insecure-cookie exception.
#
# Not named prod on purpose: a deployed configuration would also serve the
# OpenAPI document and an access log, and this file turns both off so that the
# measurement is of the request path rather than of logging.
#
# config.dev.toml is not a fair thing to measure: it logs at debug, prints every
# statement the database runs, and writes an access log line per request. That
# is what you want while building and it is several times the cost of the work
# being measured, so the comparison runs against this file instead.
[server]
port = 8082
health = "/healthz"
readiness = "/readyz"
# No openapi or api_doc key here: the document and its UI stay out of a
# deployed binary's surface.

[observability]
minimum_level = "warn"
service_name = "todo-popcornweb"
stdout_format = "json"

# Statement logging is a development tool. Left on it dominates the profile of
# a service whose handlers are three queries long.
[observability.query]
enabled = "off"

# The baseline this is compared against writes no access log, so neither does
# this. Turn it back on for a real deployment.
[middleware]
access_log = false

[middleware.rdb]
enabled = true

[[middleware.rdb.connections]]
group = "default"
dsn = "postgres://todo:todo@127.0.0.1:5433/todo?sslmode=disable"
connect_timeout = "5s"
max_open_conns = 25
max_idle_conns = 25

[security.csrf]
enabled = true
# Written out because the shipped default for this key does not parse: it
# arrives as the literal text ["/**"] and the pattern reader rejects it.
include = ["/**"]

[session]
enabled = true
backend = "cookie"
cookie.name = "pw_session"
# Kept true so starting this file directly as APP_ENV=bench cannot weaken the
# cookie. load.sh copies the complete file to a temporary config.dev.toml and
# overrides SESSION_COOKIE_SECURE=false only for its loopback HTTP run. That
# lets k6's per-VU cookie jar return the session on later iterations.
cookie.secure = true
