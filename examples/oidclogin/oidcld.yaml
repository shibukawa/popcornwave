# Local development identity provider for this sample.
#
#   go run github.com/shibukawa/oidcld@v0.2.0 serve --port 18080
#
# oidcld is a development-only provider: client secrets are not enforced and
# redirect URIs are accepted dynamically. Never point a deployment at it.

oidc:
  iss: "http://localhost:18080"
  pkce_required: true
  nonce_required: true
  expired_in: 3600
  aud_claim_format: "string"
  valid_scopes:
    - "openid"
    - "profile"
    - "email"
  refresh_token_enabled: false
  end_session_enabled: true

users:
  admin:
    display_name: "Administrator"
    extra_claims:
      email: "admin@example.com"
      role: "admin"
      # A directory-issued identifier. Set auth.oidc.identity_claim to
      # "employee_number" to key accounts on it instead of on the subject.
      employee_number: "E-00001"
  user:
    display_name: "Regular User"
    extra_claims:
      email: "user@example.com"
      role: "user"
      employee_number: "E-10231"
