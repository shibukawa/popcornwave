# Development runtime configuration, selected by APP_ENV=dev (the default).

[server]
port = 8080

[observability]
minimum_level = "debug"
service_name = "passkeylogin"

# The framework tables and the application tables share this database. The
# framework tables come from the migrations named after their owning package.
[middleware.rdb]
enabled = true

[[middleware.rdb.connections]]
group = "default"
dsn = "sqlite://passkeylogin.db"
connect_timeout = "5s"
max_open_conns = 1
max_idle_conns = 1

[session]
enabled = true
backend = "rdb"
renewal_interval = "5m"
cookie.name = "pw_session"
# Loopback development only. Keep secure = true everywhere else.
cookie.secure = false
cookie.same_site = "lax"
# One secret signs and seals everything the browser carries, whatever the
# backend is: a session.ReadOnly slot is signed and a session.Private slot is
# sealed, including while a visitor is still anonymous. Authentication registers
# such a slot, so this project does not start without one.
#
# This value belongs to development only. Every other environment reads
# SESSION_KEYRING_SECRET, and "pw doctor --env" reports a literal here as an
# error for any environment but dev.
keyring.secret = "TrNuSu4f6F2TIZweewu0m3KBJMEg3KMRYdoWsJHPQbQ="
rdb.source = "middleware"

[auth]
enabled = true
session.ttl = "12h"
session.idle_timeout = "1h"
mode = "oidc_passkey"
post_login_path = "/"
protection.include = ["/mypage"]
protection.unauthenticated = "redirect"
# The provider is the recovery authority: an account that loses every passkey
# signs in through OpenID Connect again and enrolls a new one.
recovery.policy = "oidc"
# How recently a request must have authenticated before it may add a login
# method. A passkey session counts, so a second device needs no provider trip.
recent_auth_max_age = "5m"

# A relying party is scoped to a domain. "localhost" is a secure origin for
# WebAuthn without TLS, which is why this sample needs no certificate; an IP
# literal such as 127.0.0.1 can never be an RP ID, so reach the app by name.
[auth.passkey]
rp_id = "localhost"
rp_name = "Passkey login"
origins = ["http://localhost:8080"]
user_verification = "required"
discoverable = "preferred"

[auth.oidc]
# pw dev injects AUTH_OIDC_ISSUER, AUTH_OIDC_CLIENT_ID, and
# AUTH_OIDC_CLIENT_SECRET from the provider it starts, so no issuer or
# credential is committed here. Running without pw dev requires setting them.
redirect_url = "http://localhost:8080/auth/callback"
scopes = ["profile", "email"]
# The verified claim that identifies a local account. "sub" is the OpenID
# Connect default; a directory that issues its own stable identifier, such as an
# employee number, names that claim here instead.
identity_claim = "employee_number"
admission = "authenticated"
auto_provision = true
# Set admission = "registered" to admit only identities that were inserted into
# popcornweb_auth_allowlist beforehand.
# registered_claims = ["sub", "email"]
# The development provider serves plain HTTP on loopback; a real issuer must be
# HTTPS.
allow_loopback_http = true
# Sign out of the provider as well. Without it the provider stays signed in and
# the next login returns the same user without asking.
logout_scope = "global"

# Both pages carry a form that logs out, which is an unsafe route, so the check
# covers something. A rendered form also needs the token now: a template with
# method="post" emits a hidden field, and the render fails rather than shipping
# an unprotected form.
[security]
csrf.enabled = true
csrf.include = ["/**"]
