[project]
name = "passkeylogin"
main = "./cmd/passkeylogin"
database = "sqlite"

# Each purpose reads only the directories it lists, and nothing else. A source
# directory is invisible to that purpose until it appears here.
[generate]
handlers = ["handlers"]
templates = ["handlers", "templates"]
queries = ["queries"]
config = ["cmd/passkeylogin"]

# pw dev walks the module for rebuild inputs. Add what the walk misses, and
# exclude a subtree that only makes the walk slower.
[dev.watch]
includes = []
excludes = []

# pw dev runs the development identity provider and injects its issuer and
# generated client credentials, so this sample needs no external provider.
[dev.idp]
enabled = true
config = "devidp.toml"
# A fixed port keeps the issuer URL stable across restarts. The issuer is part
# of the account link, so an ephemeral port would provision a new account for
# the same person on every pw dev run.
port = 18080
